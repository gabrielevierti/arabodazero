<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 387" width="960" height="387" role="img" aria-label="Features: Un percorso per livelli: Dall'alfabeto (A0) al C1 «Competenza professionale»: sai sempre da dove partire e cosa viene dopo.; Alfabeto e scrittura a mano: Le 28 lettere nelle quattro posizioni, da ricalcare e scrivere con dito, mouse o penna.; Correzione automatica: Riconosce una risposta giusta anche senza vocali, con hamza diversa o con ة/ه scambiate.; Ripasso e flashcard: Ripasso degli errori e flashcard con ripetizione dilazionata, anche dalle parole di ogni lezione.; Sessioni guidate: Ripasso, lettura e pratica intorno a un obiettivo giornaliero scelto da te.; I progressi restano tuoi: Salvati nel browser, con backup da esportare e, se vuoi, una copia nel tuo Google Drive."><title>Features: Un percorso per livelli: Dall'alfabeto (A0) al C1 «Competenza professionale»: sai sempre da dove partire e cosa viene dopo.; Alfabeto e scrittura a mano: Le 28 lettere nelle quattro posizioni, da ricalcare e scrivere con dito, mouse o penna.; Correzione automatica: Riconosce una risposta giusta anche senza vocali, con hamza diversa o con ة/ه scambiate.; Ripasso e flashcard: Ripasso degli errori e flashcard con ripetizione dilazionata, anche dalle parole di ogni lezione.; Sessioni guidate: Ripasso, lettura e pratica intorno a un obiettivo giornaliero scelto da te.; I progressi restano tuoi: Salvati nel browser, con backup da esportare e, se vuoi, una copia nel tuo Google Drive.</title><style>
