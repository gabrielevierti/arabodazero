<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="Arabo da Zero: Un percorso gratuito e aperto per imparare l'arabo, dall'alfabeto al livello C1, con lezioni ed esercizi."><title>Arabo da Zero: Un percorso gratuito e aperto per imparare l'arabo, dall'alfabeto al livello C1, con lezioni ed esercizi.</title><style>
